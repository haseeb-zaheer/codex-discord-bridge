[project]
name = "codex-discord-bridge"
version = "0.1.0"
description = "DM-only Discord bridge for autonomous local Codex CLI sessions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
codex-discord-bridge = "codex_discord_bridge.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
